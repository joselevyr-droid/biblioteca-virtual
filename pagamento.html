<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento</title>

<style>

/* Corpo da página */
body{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
    margin:0;
    padding-top:60px;
    font-family:Arial,sans-serif;

    background-color:white;
    background-image:url("sua-imagem.jpg");
    background-size:cover;
    background-repeat:no-repeat;
    background-position:center;
    background-attachment:fixed;

    color:black;
}

/* camada escura do fundo */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.3);
    z-index:-1;
}

/* dark mode */
body.dark{
    background-color:#111;
    color:white;
}

body.dark::before{
    background:rgba(0,0,0,0.6);
}
  /* CSS Houdini property */
  @property --angulo {
    syntax: "<angle>";
    initial-value: 0deg;
    inherits: false;
} /* property fix */

/* container principal */
.pagamento-container{
    width:90%;
    max-width:450px;
    padding:60px 40px 40px 40px;
    position: relative;
    border-radius:12px;
    border:3px solid transparent;

    background:
        linear-gradient(white, white) padding-box,
        conic-gradient(from var(--angulo), #4CAF50, transparent, #4CAF50) border-box;

    animation:girarBorda 4s linear infinite;

    box-shadow:0 0 15px rgba(0,0,0,0.3);
    text-align:center;
  box-sizing: border-box;
}
  
  html, body {
    overflow-x: hidden;
}
  
body.dark .pagamento-container{
    background:
        linear-gradient(#1e1e1e, #1e1e1e) padding-box,
        conic-gradient(from var(--angulo), #1976D2, transparent, #1976D2) border-box;
}
  
@keyframes girarBorda{
    from{
        --angulo:0deg;
    }
    to{
        --angulo:360deg;
    }
}
  
/* botão voltar */
.botao-voltar{
    position:fixed;
    top:20px;
    left:20px;

    padding:8px 16px;
    background:#4CAF50;
    color:white;
    text-decoration:none;

    border-radius:8px;
    font-weight:bold;

    z-index:1000;
}

.botao-voltar:hover{
    background:#45a049;
}

body.dark .botao-voltar{
    background:#1976D2;
}
.usuario-topo{
    position:absolute;
    top:15px;
    right:20px;

    display:flex;
    align-items:center;
    gap:10px;
}

.foto-usuario{
width:50px;
height:50px;
border-radius:50%;
object-fit:cover;
}

.nome-usuario{
font-size:18px;
font-weight:bold;
}

.email-usuario{
font-size:13px;
opacity:0.7;
}
  }
  
.titulo-premium{
    text-align:center;
    margin-top:55px;
    margin-bottom:25px;
  position:relative;
}
  
.titulo-premium::after{
    content:"";
    display:block;
    width:120px;
    height:3px;
    margin:10px auto 0 auto;
    background:#4CAF50;
    border-radius:3px;
}

/* cor no dark mode */
body.dark .titulo-premium::after{
    background:#1976D2;
}

/* área geral */
.area-pagamento{
    display:flex;
    justify-content:center;
    align-items:center;
  gap:40px;
}

/* lado esquerdo */
.lado-codigo{
    display:flex;
    flex-direction:column;
  align-items: center; 
}

/* texto Code */
.label-code{
    font-weight:bold;
    margin-bottom:6px;
}

/* input + botão */
.code-area{
    display:flex;
    gap:10px;
  margin-right:5px;
}
  
@media (max-width: 500px) {
    .area-pagamento {
        flex-direction: column;
    }
}

#code-input{
    padding:8px;
    border-radius:6px;
    border:1px solid #ccc;
}

body.dark #code-input{
    background:#222;
    color:white;
    border:1px solid #555;
}

#botao-code{
    padding:8px 14px;
    border:none;
    border-radius:6px;
    background:#4CAF50;
    color:white;
    cursor:pointer;
}

#botao-code:hover{
    background:#45a049;
}

body.dark #botao-code{
    background:#1976D2;
}

/* qr code */
.qr-code{
    width:120px;
    height:120px;
}
  
  
</style>
</head>

<body>

<a href="index.html" class="botao-voltar">← Voltar</a>

<div class="pagamento-container">

  <div class="usuario-topo">

<img id="foto-usuario" class="foto-usuario"
src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSL5ECfbpSQgG7qV_Rstvw0XK6nTSi24UihrOX7xsYhbg&s=10">

<div class="info-usuario">
<div id="nome-usuario-topo" class="nome-usuario">Usuário</div>
<div id="email-usuario-topo" class="email-usuario">email@exemplo.com</div>
</div>

</div>
  
  <h2 class="titulo-premium">Livros Premium</h2>

<div class="area-pagamento">

<div class="lado-codigo">

<div class="label-code">Code:</div>

<div class="code-area">
<input type="text" id="code-input" placeholder="Digite o código">
<button id="botao-code">Enviar</button>
</div>
  
</div>
  
</div>
  <div class="lado-qr">
</div>
<div class="lado-qr">
<script>

/* scroll pro topo */
window.onload = function(){
    window.scrollTo(0,0);
}

/* fundo personalizado */
let fundoSalvo = localStorage.getItem("fundo");

if(fundoSalvo){
    document.body.style.backgroundImage = "url('" + fundoSalvo + "')";
}

/* dark mode */
if(localStorage.getItem("modo") === "dark"){
    document.body.classList.add("dark");
}

</script>
  <script>
  // pegar dados do login
let nomeUsuario = localStorage.getItem("nomeUsuario");
let emailUsuario = localStorage.getItem("email");
let avatarUsuario = localStorage.getItem("avatar");

// aplicar na tela
if(nomeUsuario){
document.getElementById("nome-usuario-topo").textContent = nomeUsuario;
}

if(emailUsuario){
document.getElementById("email-usuario-topo").textContent = emailUsuario;
}

if(avatarUsuario){
document.getElementById("foto-usuario").src = avatarUsuario;
}
  </script>
  
  <script>
const botaoCode = document.getElementById("botao-code");

botaoCode.addEventListener("click", function() {
    const codigo = document.getElementById("code-input").value;
    const emailAtual = localStorage.getItem("email");
    const senhaAtual = localStorage.getItem("senha");

    if(codigo === "DevLevyr"){
        // salva que enviou o código
        localStorage.setItem("codigoDevLevyr", "true");

        // salva na lista de emails/senhas do livro
        let listaUsuarios = JSON.parse(localStorage.getItem("usuariosDevLevyr") || "[]");

        let existe = listaUsuarios.some(u => u.email === emailAtual && u.senha === senhaAtual);
        if(!existe){
            listaUsuarios.push({email: emailAtual, senha: senhaAtual});
            localStorage.setItem("usuariosDevLevyr", JSON.stringify(listaUsuarios));
        }

        alert("Código aceito!");
        window.location.href = "index.html";
    } else if(codigo.toLowerCase() === "reset") {
        // comando reset para esse livro
        localStorage.removeItem("usuariosDevLevyr");
        localStorage.removeItem("codigoDevLevyr");
        alert("Lista de DevLevyr resetada!");
    } else {
        alert("Código inválido.");
    }
});

// permitir enviar com Enter
document.getElementById("code-input").addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        botaoCode.click();
    }
});
    localStorage.setItem("usuarios" + codigo, JSON.stringify(listaUsuarios));
</script>
    
</body>
</html>
