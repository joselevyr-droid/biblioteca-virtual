<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
  
/* Corpo como flex container horizontalmente centralizado, verticalmente no topo */
body {
    display: flex;
    justify-content: center;  /* centraliza horizontalmente */
    align-items: flex-start;  /* container vai para o topo */
    min-height: 100vh;
    margin: 0;
    padding-top: 60px;       /* distância do topo */
    font-family: Arial, sans-serif;
    background-color: white;
    background-image: url("sua-imagem.jpg");
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    background-attachment: fixed;
    color: black;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.3);
    z-index: -1;
}

/* Dark mode */
body.dark {
    background-color: #111;
    color: white;
}

body.dark::before {
    background: rgba(0,0,0,0.6);
}

/* Container de login */
.login-container {
    width: 90%;
    max-width: 400px;
    padding: 40px;
    background: rgba(255,255,255,0.9);
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(0,0,0,0.3);
    text-align: center;
    position: relative;
}

body.dark .login-container {
    background: rgba(30,30,30,0.9);
}

/* Título placeholder */
.login-container h1 {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 20px;
}

/* Responsividade */
@media (max-width: 500px) {
    body {
        padding-top: 40px;  /* um pouco menos no celular */
    }
    .login-container {
        padding: 30px;
    }
}
  
.topo-login{
    position:relative;
    width:120px;
    margin:0 auto 20px auto;
}

.avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border: 3px solid #4CAF50;
}

.avatar-upload{
    position:absolute;
    bottom:0;
    right:0;
    cursor:pointer;
}

.avatar-upload img{
    width:35px;
    height:35px;
    border-radius:50%;m
    border: 2px solid #4CAF50;
}

/* Dark mode borda do avatar */
body.dark .avatar {
    border: 3px solid #1976D2;
}

/* Dark mode ícone */
body.dark .avatar-upload img {
    border: 2px solid #222;
}
    
.botao-voltar{
    position: fixed;
    top: 20px;
    left: 20px;
    padding: 8px 16px;
    background: #4CAF50;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    z-index: 1000;
}

.botao-voltar:hover{
    background:#45a049;
}

body.dark .botao-voltar{
    background:#1976D2;
}
    
.nome-usuario-area{
    position:relative;
    width:100%;
    text-align:center;
}

#nome-usuario{
    margin:0;
}

.editar-nome{
    position:absolute;
    right:0;
    top:50%;
    transform:translateY(-50%);
    font-size:12px;
    padding:4px 10px;
    border:none;
    border-radius:6px;
    background:#e5e5e5;   /* cinza claro no modo normal */
    color:#333;
    cursor:pointer;
}

.editar-nome:hover{
    text-decoration:underline;
    background:#d6d6d6;
}

body.dark .editar-nome{
    color:#64B5F6;
    background:#444;
    color:#fff;
}
  
body.dark .editar-nome:hover{
    background:#555;
}
    
.campo-login{
    width:100%;
    margin-top:20px;
    text-align:left;
}

.campo-login label{
    font-size:14px;
    font-weight:bold;
}

.campo-login input{
    width:100%;
    margin-top:6px;
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;
    box-sizing:border-box;
}

/* modo escuro */
body.dark .campo-login input{
    background:#222;
    color:white;
    border:1px solid #555;
}
    
.botao-area{
    width:100%;
    margin-top:25px;
    text-align:center;
}

.botao-salvar{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    background:#4CAF50;
    color:white;
    cursor:pointer;
}

.botao-salvar:hover{
    background:#45a049;
}

body.dark .botao-salvar{
    background:#1976D2;
}
    
.senha-box{
    position: relative;
    width: 100%;
}

.senha-box input{
    width: 100%;
    padding-right: 40px;
}

#olho{
    position: absolute;
    right: 10px;
    top: 9px;
    cursor: pointer;
    font-size: 18px;
}

.senha-box img{
    width: 24px;
    position: absolute;
    right: 10px;
    top: 8px;
    cursor: pointer;
}
    
.botao-reset{
    position:absolute;
    top:10px;
    right:10px;
    width:28px;
    cursor:pointer;
    opacity:0.8;
}

.botao-reset:hover{
    opacity:1;
}
    
</style>
</head>

<body>

    <a href="index.html" class="botao-voltar">← Voltar</a>
    
<div class="login-container">
    
    <img src="https://cdn-icons-png.flaticon.com/512/1828/1828843.png" 
class="botao-reset" 
onclick="resetarDados()">

    <div class="topo-login">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSL5ECfbpSQgG7qV_Rstvw0XK6nTSi24UihrOX7xsYhbg&s=10" id="avatar-principal" class="avatar">

        <label for="upload-avatar" class="avatar-upload">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQyFmIddWvM22FtAnnhsGyn2ddCSxm-mdsNFdriLg_I_w&s=10">
        </label>

        <input type="file" id="upload-avatar" accept="image/*" style="display:none">
    </div>

    <div class="nome-usuario-area">
    <h1 id="nome-usuario">Usuário</h1>
    <button id="editar-nome" class="editar-nome">Editar</button>
</div>

    <div class="campo-login">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Digite seu email">
</div>
    
    <div class="campo-login">
    <label for="cpf">CPF (opcional)</label>
    <input type="text" id="cpf" placeholder="Digite seu CPF">
</div>

<div class="campo-login">
    <label for="senha">Senha</label>
    
  <div class="senha-box">
    <input type="password" id="senha" placeholder="Digite sua senha">
      <span id="olho" onclick="mostrarSenha()">👁️</span>
</div>
    
</div>
    
<div class="botao-area">
    <button id="salvar-dados" class="botao-salvar">Salvar</button>
</div>
    
</div>
  
<script>
/* Scroll pro topo */
window.onload = function() {
    window.scrollTo(0, 0);
};

/* Fundo personalizado */
let fundoSalvo = localStorage.getItem("fundo");
if(fundoSalvo){
    document.body.style.backgroundImage = "url('" + fundoSalvo + "')";
}

/* Dark mode */
if(localStorage.getItem("modo") === "dark"){
    document.body.classList.add("dark");
}
</script>

    <script>
const uploadInput = document.getElementById('upload-avatar');
const avatar = document.getElementById('avatar-principal');

uploadInput.addEventListener('change', function(event){
    const file = event.target.files[0];

    if(file){
        const reader = new FileReader();

        reader.onload = function(e){
            avatar.src = e.target.result;
            localStorage.setItem("avatar", e.target.result);
        };

        reader.readAsDataURL(file);
    }
});

const avatarSalvo = localStorage.getItem("avatar");
if(avatarSalvo){
    avatar.src = avatarSalvo;
}
</script>
  
    <script>
    const nomeUsuario = document.getElementById("nome-usuario");
const editarNome = document.getElementById("editar-nome");

// carregar nome salvo
let nomeSalvo = localStorage.getItem("nomeUsuario");

if(nomeSalvo){
    nomeUsuario.textContent = nomeSalvo;
}

// botão editar
editarNome.addEventListener("click", function(){

    let novoNome = prompt("Digite seu nome:");

    if(novoNome && novoNome.trim() !== ""){
        nomeUsuario.textContent = novoNome;
        localStorage.setItem("nomeUsuario", novoNome);
    }

});
    </script>
    <script>
    const cpfInput = document.getElementById("cpf");

cpfInput.addEventListener("input", function () {
    let valor = cpfInput.value;

    // remove tudo que não for número
    valor = valor.replace(/\D/g, "");

    // limita a 11 números
    valor = valor.substring(0, 11);

    // aplica a máscara
    valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
    valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
    valor = valor.replace(/(\d{3})(\d{1,2})$/, "$1-$2");

    cpfInput.value = valor;
});
    </script>
    
    <script>
    const email = document.getElementById("email");
const cpf = document.getElementById("cpf");
const senha = document.getElementById("senha");
const botaoSalvar = document.getElementById("salvar-dados");

// carregar dados salvos
email.value = localStorage.getItem("email") || "";
cpf.value = localStorage.getItem("cpf") || "";
senha.value = localStorage.getItem("senha") || "";

// botão salvar
botaoSalvar.addEventListener("click", function(){

    localStorage.setItem("email", email.value);
    localStorage.setItem("cpf", cpf.value.replace(/\D/g, ""));
    localStorage.setItem("senha", senha.value);

    // SENSOR de cadastro completo
    if(email.value.trim() !== "" && senha.value.trim() !== ""){
        localStorage.setItem("cadastroCompleto", "true");
    } else {
        localStorage.setItem("cadastroCompleto", "false");
    }

    alert("Dados salvos!");
});
    </script>
    
    <script>
    function mostrarSenha() {

let input = document.getElementById("senha");
let olho = document.getElementById("olho");

if (input.type === "password") {
    input.type = "text";
    olho.textContent = "🙈";
} else {
    input.type = "password";
    olho.textContent = "👁️";
}

}
    </script>
    
    <script>
    function resetarDados(){
    if(confirm("Deseja apagar todos os dados do usuário e as listas de códigos premium?")){

        // Dados do usuário atual
        localStorage.removeItem("nomeUsuario");
        localStorage.removeItem("avatar");
        localStorage.removeItem("email");
        localStorage.removeItem("cpf");
        localStorage.removeItem("senha");
        localStorage.removeItem("cadastroCompleto");

        // Resetar listas de códigos premium (DevLevyr e outros livros)
        localStorage.removeItem("usuariosDevLevyr");
        localStorage.removeItem("usuariosLivro2"); // se tiver outro livro
        localStorage.removeItem("usuariosLivro3"); // idem

        location.reload();
    }
}
    </script>
    
</body>
</html>
