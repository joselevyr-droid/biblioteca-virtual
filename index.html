/* Botões no canto */

    .topo {

.botao:hover {

.titulo {

    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: "Georgia", "Times New Roman", serif;
    color: #222;
}

body.dark .titulo {
    color: #f5f5f5;
}
    
.titulo::after {
    content: "";
    display: block;
    width: 80px;
    height: 3px;
    background: #4CAF50;
    margin-top: 6px;
}
    
/* linha verde normal */
.titulo::after {
    content: "";
    display: block;
    width: 80px;
    height: 3px;
    background: #4CAF50; /* verde padrão */
    margin-top: 6px;
}

/* linha azul no modo dark */
body.dark .titulo::after {
    background: #1976D2; /* azul no modo escuro */
}

/* Imagem centralizada */
.imagem {
    display: block;
    margin: 20px auto;
    width: 300px;
    border-radius: 12px;
}

.botao-centro {

    margin-top: 20px;
}

.botao-grande {

    padding: 12px 30px;

    color: white;
    text-decoration: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    transition: 0.3s;
}

.botao-grande:hover {
    background-color: #444;
}
    
.rodape {
    text-align: center;
    margin-top: 40px;
    font-size: 14px;
}
    
body.dark {
    background-color: #111;
    color: white;
}

body.dark .botao {
    background-color: #1976D2; /* azul */
}

body.dark .botao-grande {
    background-color: gray;
}
    
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.3); /* escurece levemente */
    z-index: -1;
}
    
body.dark::before {
    background: rgba(0,0,0,0.6);
}
    
.estante {
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Quando a tela for grande */
@media (min-width: 800px) {
    
    .estante {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;

    <script>
    const botoesPremium = document.querySelectorAll(".acessar-premium");

botoesPremium.forEach(function(botao){
    botao.addEventListener("click", function(){

        let livro = botao.dataset.livro; // identifica o livro
        let linkLivro = botao.dataset.link; // pega o link do livro
        let listaUsuarios = JSON.parse(localStorage.getItem("usuarios" + livro) || "[]");

        let emailAtual = localStorage.getItem("email");
        let senhaAtual = localStorage.getItem("senha");

        // se a pessoa já enviou código e está na lista, libera acesso
        let autorizado = listaUsuarios.some(u => u.email === emailAtual && u.senha === senhaAtual);

        if(autorizado){
            window.location.href = linkLivro;
            return;
        }

        // se não tiver cadastro completo
        if(localStorage.getItem("cadastroCompleto") !== "true"){
            if(confirm("Você precisa fazer login para acessar este livro.\n\nOK = Ir para login\nCancelar = Voltar")){
                window.location.href = "login.html";
            }
            return;
        }

        // se estiver cadastrado, mas não enviou DevLevyr
        window.location.href = "pagamento.html";
    });
});
    </script>
